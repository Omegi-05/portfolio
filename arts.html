  <body>
    <div class="transport-container">
<div class="tgv"></div>
   <div class="tram"></div>   
    </div>
      

    <style >
      .transport-container {
        position: relative;
        margin-top: 100px;
        width: 100%;
        height: 200px;
        overflow: hidden;

      }

      .tgv {
        position: absolute;
        margin-top: 100px;
        right: -1000px; 
        width: 1000px;
        height: 100px;
        background-image: url('public/tgv_tgv.png'); 
        background-size: cover;
        animation: moveTGV 7s linear infinite; 
      }

      .tram {
        position: absolute;
        left: -380px; 
        width: 380px;
        height: 100px;
        background-image: url('public/tram.png'); 
        background-size: cover;
        animation: moveTram 15s linear infinite; 
      }

      @keyframes moveTGV {
        from { right: -1000px; }
        to { right: 100%; }
      }

      @keyframes moveTram {
        from { left: -380px; }
        to { left: 100%; }
      }

    </style>
  </body>
