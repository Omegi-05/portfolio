    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", sans-serif;
      }

      body {
        overflow-x: hidden;
        background: var(--creme);
        display: grid;
        width: 100%;
        cursor:
          url("public/curspen2.svg") 24 24,
          auto;
      }

      .transport-container {
        position: relative;
        margin-top: 100px;
        width: 100%;
        height: 200px;
        overflow: hidden;
      }

      .tgv {
        position: absolute;
        margin-top: 100px;
        right: -1000px;
        width: 1000px;
        height: 100px;
        background-image: url("public/tgv_tgv.png");
        background-size: cover;
        animation: moveTGV 7s linear infinite;
      }

      .tram {
        position: absolute;
        left: -380px;
        width: 380px;
        height: 100px;
        background-image: url("public/tram.png");
        background-size: cover;
        animation: moveTram 15s linear infinite;
      }

      @keyframes moveTGV {
        from {
          right: -1000px;
        }
        to {
          right: 100%;
        }
      }

      @keyframes moveTram {
        from {
          left: -380px;
        }
        to {
          left: 100%;
        }
      }

    /* caroussel photos */
      #gallery {
        height: 600px;
      }
      
      .corde {
        background-size: cover;
        height: 90px;
        z-index: 10;
        }

      #canicooking {
        padding: 20px 0;
        max-width: 100%;
        max-height: 700px;  
      }


      .sixseven:hover {
        transform: translateY(-3px);
        transition: all ease-in-out 0.3s;
        transform: scale(1.2);
      }

      .sixseven {
        width: 100%;
        color: white;
        font-size: xx-large;
        justify-content: center;
        align-items: center;
        min-height: 100px;
        z-index: 100;

        .Image {
          max-width: 300px;
        }
      }

      #canicooking {
        > * {
          flex: 0 0 100%;
        }
      }

      .group {
        display: flex;
        gap: 200px;
        padding-right: 200px;
        height: 500px;
        z-index: 100;
      }

      .group {
        will-change: transform;
        animation: droite 60s linear infinite;
      }

      @keyframes droite {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(0);
        }
      }

      #canicooking {
        /* ... */
        &:hover .group {
          animation-play-state: paused;
        }
      }

      /* mon "post" section */
      #post {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }


.portfolio-section {
  max-width: 1200px;
  margin: 0 auto;
  justify-content: center;
  display: flex;
}

.grid-container {
  /*gros bloc*/
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 40px;
  padding: 40px;
  width: 100%;
  background: rgba(255, 255, 255, 0.195);
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
}


.portfolio-item {
  /*item bloc*/
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  border: 3px solid #ffffff;
  cursor: pointer;
  transition: all 0.3s ease;
  background-color: #ffffffaa;
}


.portfolio-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.portfolio-image:hover {
    transform: scale(1.05);
    transition: transform 0.3s ease-in-out;
}

.parent {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 25px;
}
    
.div1 {
    grid-column: span 3 / span 3;
    grid-row: span 3 / span 3;
}

.div2 {
    grid-column: span 3 / span 3;
    grid-row: span 3 / span 3;
    grid-column-start: 1;
    grid-row-start: 4;
}

.div3 {
    grid-column: span 2 / span 2;
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 1;
}

.div4 {
    grid-column: span 2 / span 2;
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 3;
}

.div5 {
    grid-column: span 2 / span 2;
    grid-row: span 2 / span 2;
    grid-column-start: 4;
    grid-row-start: 5;
}

.div6 {
    grid-column-start: 6;
    grid-row-start: 1;
    background-color: rgb(16, 81, 90);
}

.div7 {
    grid-column-start: 6;
    grid-row-start: 2;
    background-color: rgb(22, 114, 86);
}

.div8 {
    grid-column-start: 6;
    grid-row-start: 3;
    background-color: rgb(61, 194, 154);
}

.div9 {
    grid-column-start: 6;
    grid-row-start: 4;
    background-color: rgb(194, 255, 240);
}

.div10 {
    grid-column-start: 6;
    grid-row-start: 5;
    background-color: rgb(120, 248, 220);
}

.div11 {
    grid-column-start: 6;
    grid-row-start: 6;
    background-color: rgb(44, 161, 156);
}
