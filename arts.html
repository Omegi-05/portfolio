    <script src="arts.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", sans-serif;
      }

      body {
        overflow-x: hidden;
        background: var(--creme);
        display: grid;
        width: 100%;
        cursor:
          url("public/curspen2.svg") 24 24,
          auto;
      }

      .transport-container {
        position: relative;
        margin-top: 100px;
        width: 100%;
        height: 200px;
        overflow: hidden;
      }

      .tgv {
        position: absolute;
        margin-top: 100px;
        right: -1000px;
        width: 1000px;
        height: 100px;
        background-image: url("public/tgv_tgv.png");
        background-size: cover;
        animation: moveTGV 7s linear infinite;
      }

      .tram {
        position: absolute;
        left: -380px;
        width: 380px;
        height: 100px;
        background-image: url("public/tram.png");
        background-size: cover;
        animation: moveTram 15s linear infinite;
      }

      @keyframes moveTGV {
        from {
          right: -1000px;
        }
        to {
          right: 100%;
        }
      }

      @keyframes moveTram {
        from {
          left: -380px;
        }
        to {
          left: 100%;
        }
      }

       .corde {
        width: 100px;
        height: 100px;
        background-size: cover;
      }

 .canicooking {
    padding: 20px 0;
    max-width: 100%;
    overflow: hidden;
    display: flex;
    margin-top: 20px;
  }

  .sixseven:hover {
  transform: translateY(-3px);
  transition: all ease-in-out 0.3s;
  transform: scale(1.20);
  }

  .sixseven {
    width:100%;
    color: white;
    border-radius: 24px;
    padding: 20px;
    font-size: xx-large;
    justify-content: center;
    align-items: center;
    min-height: 100px;

    .Image {
      max-width: 200px;
    }
  }

    .canicooking {
    > * {
      flex: 0 0 100%;
    }
  }

  .group {
    display: flex;
    gap: 20px;
    padding-right: 20px;
    height: 330px;
  }

  .group {
    will-change: transform; 
    animation: droite 60s linear infinite;
  }

  @keyframes droite {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(0);

    } 
  }

    .canicooking {
    /* ... */
    &:hover .group {
      animation-play-state: paused;
    }

  }

  




    </style>
