      $(".flipbook").turn();

    <div class="transport-container">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", sans-serif;
      }

      body {
        overflow-x: hidden;
        background: var(--creme);
        display: grid;
        width: 100%;
        cursor:
          url("public/curspen2.svg") 24 24,
          auto;
      }

      .flipbook {
        width: 800px;
        height: 600px;
        margin: 100px auto;
      }

      .flipbook .hard {
        background-color: #333;
        color: #ffffff;
        font-size: 50px;
        text-align: center;
        line-height: 50px;
        border: none;
        height: 200px;
        border-radius: 19px;
      }

      .flipbook .hard small {
        font-size: 14px;
        line-height: 1.2;
      }

      .flipbook .page {
        background: rgb(44, 44, 44);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        border: 5px solid rgba(0, 0, 0, 0.11);
        border-radius: 19px;
      }

.page img{
	width: 100%;
  height: 100%;
	object-fit: cover;
  border-radius: 19px;
  }

      .flipbook .page small {
        font-size: 14px;
        margin-bottom: 10px;
      }


      
      .transport-container {
        position: relative;
        margin-top: 100px;
        width: 100%;
        height: 200px;
        overflow: hidden;
      }

      .tgv {
        position: absolute;
        margin-top: 100px;
        right: -1000px;
        width: 1000px;
        height: 100px;
        background-image: url("public/tgv_tgv.png");
        background-size: cover;
        animation: moveTGV 7s linear infinite;
      }

      .tram {
        position: absolute;
        left: -380px;
        width: 380px;
        height: 100px;
        background-image: url("public/tram.png");
        background-size: cover;
        animation: moveTram 15s linear infinite;
      }

      @keyframes moveTGV {
        from {
          right: -1000px;
        }
        to {
          right: 100%;
        }
      }

      @keyframes moveTram {
        from {
          left: -380px;
        }
        to {
          left: 100%;
        }
      }
    </style>
  </body>
